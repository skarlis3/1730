    <section class="page-head">
      <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Final Project</p>
      <h1>Checklist</h1>
      <div class="head-rule" aria-hidden="true"></div>
    </section>

    <nav class="subnav" data-subnav="final-project" aria-label="Final Project"></nav>

    <p class="checklist-note">Checkboxes save on this device only &mdash; they don&rsquo;t submit anything or sync across devices.</p>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-reviews.html">Finding and Choosing Reviews</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-1"><label for="fp-check-1">Three reviews of the reading you chose</label></li>
        <li><input type="checkbox" id="fp-check-2"><label for="fp-check-2">One professional review</label></li>
        <li><input type="checkbox" id="fp-check-3"><label for="fp-check-3">One non-professional review</label></li>
        <li><input type="checkbox" id="fp-check-4"><label for="fp-check-4">A third review from a different site or publication than the first two</label></li>
        <li><input type="checkbox" id="fp-check-5"><label for="fp-check-5">No study guide sites (such as SparkNotes or Studocu) or AI summaries</label></li>
      </ul>
    </div>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-check-in.html">Final Project Check-in</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-6"><label for="fp-check-6">The reading you chose</label></li>
        <li><input type="checkbox" id="fp-check-7"><label for="fp-check-7">At least three reviews</label></li>
        <li><input type="checkbox" id="fp-check-8"><label for="fp-check-8">For each review: the title, the author (for social media, the user name is fine), a working link, and whether it is a professional or non-professional review</label></li>
        <li><input type="checkbox" id="fp-check-9"><label for="fp-check-9">For each review: a few bullet points on the specific points the author/content creator makes about the text</label></li>
      </ul>
    </div>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-analysis.html">The Analysis</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-10"><label for="fp-check-10">3&ndash;5 specific points for each review</label></li>
        <li><input type="checkbox" id="fp-check-11"><label for="fp-check-11">Quotes from the text that support or push back against each point</label></li>
        <li><input type="checkbox" id="fp-check-12"><label for="fp-check-12">A small blurb for each quote explaining whether it supports the point or pushes back against it, and why</label></li>
      </ul>
    </div>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-your-take.html">Your Take</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-13"><label for="fp-check-13">One of the two options: your take on the reviews, or your own review</label></li>
        <li><input type="checkbox" id="fp-check-14"><label for="fp-check-14">A minimum of 400 words</label></li>
      </ul>
    </div>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-presentation.html">The Presentation</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-15"><label for="fp-check-15">The name of your chosen text</label></li>
        <li><input type="checkbox" id="fp-check-16"><label for="fp-check-16">A title for the presentation</label></li>
        <li><input type="checkbox" id="fp-check-17"><label for="fp-check-17">The original reviews: printed articles (stapled if longer), and for videos, a screenshot, a QR code, and the printed link</label></li>
        <li><input type="checkbox" id="fp-check-18"><label for="fp-check-18">The points the reviewers make</label></li>
        <li><input type="checkbox" id="fp-check-19"><label for="fp-check-19">Quotes from the text that support or push back against each point</label></li>
        <li><input type="checkbox" id="fp-check-20"><label for="fp-check-20">Your analysis of each quote</label></li>
        <li><input type="checkbox" id="fp-check-21"><label for="fp-check-21">Your Take</label></li>
        <li><input type="checkbox" id="fp-check-29"><label for="fp-check-29">The presentation is freestanding, readable, polished, and the design choices fit the reading.</label></li>
        <li><input type="checkbox" id="fp-check-27"><label for="fp-check-27">If you work with classmates: it&rsquo;s clear whose reviews and analysis are whose, and you don&rsquo;t use the same review as a classmate</label></li>
      </ul>
    </div>

    <h2 class="section-head"><span class="h2-mark" aria-hidden="true"></span><a href="/assignments/final-project-presentation-day.html">Presentation Day</a></h2>

    <div class="card card-doc">
      <ul class="checklist">
        <li><input type="checkbox" id="fp-check-28"><label for="fp-check-28">Attend class on presentation day, with your display</label></li>
      </ul>
    </div>
